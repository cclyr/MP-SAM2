name: Bug report
description: Report a reproducible MP-SAM2 problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the command and a minimal data-free example where possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Report OS, Python, PyTorch, CUDA, and GPU versions.
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Do not upload private datasets, credentials, or unpublished checkpoints."

