[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-sam2"
version = "1.0.0"
description = "Multi-prompt transfer learning with SAM2 for ECC microcrack segmentation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "Yanhui Chen"},
  {name = "Jingjie Wei"},
  {name = "Hengliang Liu"},
  {name = "Jinghao Huang"},
  {name = "Haojia Lv"},
  {name = "Ge Zhang"},
  {name = "Shuai Teng"},
  {name = "Jianbo Zang"},
  {name = "Jiaxiang Lin"},
  {name = "Yongchang Guo"},
]
dependencies = [
  "numpy>=1.24,<2",
  "opencv-python>=4.7,<4.12",
  "pillow>=9.4",
  "tqdm>=4.66",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3",
  "iopath>=0.1.10",
]

[project.urls]
Repository = "https://github.com/cclyr/MP-SAM2"

[tool.setuptools.packages.find]
include = ["mp_sam2*", "sam2*", "sam2_configs*"]

[tool.setuptools.package-data]
sam2_configs = ["*.yaml"]
